<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <title>EV-Reserve | 전기차 충전 예약</title>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- css link -->
    <link rel="stylesheet" href="../002.css/02_main.css" />
  </head>
  <body>


    <!-- NAV / 상단 메뉴바  -->
    <header class="navbar">
      <div class="nav-logo">CHARCAGE</div>
      <nav class="nav-links">
        <a href="#" class="nav-item active">CHARCAGE</a>
        <a href="#" class="nav-item">충전소찾기</a>
        <a href="#" class="nav-item">멤버십</a>
        <a href="#" class="nav-item">고객지원</a>
      </nav>
      <div class="nav-mypage">
       <img src="./차카지로고(누끼).png" alt="메인로고(누끼)" width="100px" >
      </div>
    </header>

    <!-- 메인 동영상 화면 -->
    <section class="hero">
      <div class="video-background">
        <video autoplay muted loop>
          <source src="../KakaoTalk_20260325_121226509.mp4" type="video/mp4" />
          글자
        </video>
      </div>

      <div class="hero-content">
        <h1 class="hero-title">친환경 이동을 더 똑똑하게</h1>
        <p class="hero-sub">Save time, Reserve your charge</p>
      </div>

    </section>




<!-- // -->
 <div class="container">
      <!-- 지도 검색  -->
      <form class="search" action="" method="post">
        <input
          type="search"
          class="search-box"
          name="q"
          placeholder="검색위치"
        />
        <button type="submit" name="searchButton" value="clicked">검색</button>
      </form>
      <!--  충전소 찾기 아이콘  -->
      <div class="charging">
        <a href="./" alt="find charging">
          <img src="../충전소찾기 아이콘.png" />
        </a>
      </div>
      <!--  즐겨찾기 아이콘 -->
      <div class="favorites">
        <a href="./" alt="favorites">
          <img src="../즐겨찾기아이콘.png" />
        </a> 
      </div>
      <div clas="pay-container">
        <!--  evpay 아이콘  -->
        <div class="evpay">
          <a href="./" alt="evpay">
            <img src="../페이결제 아이콘.png" alt="페이/충전" />
          </a>
        </div>
        <!-- qn/nfc아이콘 -->
        <div class="qnnfc">
          <a href="./" alt="QN/NFC">
            <img src="../QR스캔 아이콘.png" alt="QN/NFC" />
          </a>
        </div>
        <div class="community">
          <a href="./" alt="community">
            <img src="../community아이콘.png" alt="community icon" />
          </a>
        </div>
      </div>
      <div id="map"></div>
      <script src="../js/02_map.js"></script>
    </div>
  </body>
</html>
